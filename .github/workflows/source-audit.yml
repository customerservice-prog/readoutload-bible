name: Scripture source audit
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect all original editions before validation
        run: |
          node --input-type=module <<'NODE'
          import {SOURCES} from './scripts/build.mjs';
          import {mkdir,writeFile} from 'node:fs/promises';
          await mkdir('.sources',{recursive:true});
          await Promise.all(SOURCES.map(async s=>{
            for(const url of [s.url,s.fallback].filter(Boolean))try{
              const r=await fetch(url,{signal:AbortSignal.timeout(60000)});
              if(!r.ok)throw new Error(String(r.status));
              const raw=Buffer.from(await r.arrayBuffer());
              if(raw.length<10000)throw new Error('Too small');
              await writeFile('.sources/'+s.id+'.txt',raw);console.log(s.id,raw.length);return;
            }catch(e){console.warn(s.id,url,e.message);}
          }));
          NODE
      - run: node scripts/build.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scripture-library
          include-hidden-files: true
          path: |
            public/data/
            .sources/
          retention-days: 3
