name: Reader checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0 && python -m playwright install --with-deps chromium
      - name: Desktop and mobile production browser checks
        env:
          TEST_BASE_URL: https://read-aloud-production-148a.up.railway.app
        run: python tests/browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-tested-build
          path: |
            public/
            test-results/
            server.mjs
            package.json
          retention-days: 7
